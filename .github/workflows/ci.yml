name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: vet / test / build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go 1.27 is a release candidate; actions/setup-go accepts the full RC
      # version string "1.27.0-rc.2" (the rc available at time of scaffolding).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0-rc.2"
          cache: true

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build
